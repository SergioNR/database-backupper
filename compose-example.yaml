name: databasebackuper
services:
  backupper:
    container_name: backupper
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 12500
      DATABASE_URL: postgresql://user:password@metadata-db:5432/backupper_metadata
      S3_BUCKET: ""
      S3_REGION: us-east-1
      S3_ENDPOINT: ""
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_PATH_PREFIX: ""
      PROCESSOR_INTERVAL: 900
    volumes:
      - ./backups:/tmp
    ports:
      - 12500:12500
    depends_on:
      - metadata-db
  metadata-db:
    container_name: metadata-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: backupper_metadata
    volumes:
      - metadata-pgdata:/var/lib/postgresql/data
volumes:
  metadata-pgdata:
