schema: spec-driven

context: |
  Tech stack: Node.js (ESM via "type": "module"), Express 5, cron (npm package), pg_dump (PostgreSQL client)
  Runtime: Docker (Node 26 Alpine-based), multi-platform (AMD64/ARM64)
  Entry point: src/index.mjs
  Package manager: npm
  Container port: 12500
  Backup output: /tmp inside container, mounted via Docker volumes
  CI: GitHub Actions — builds on push to "latest" or "next" branches, pushes to sergion14/database-backup on Docker Hub
  File extensions: .mjs for entry point, .js for all other modules (both treated as ESM due to "type": "module")
  Known issues:
    - backup.js uses callback-based exec() inside an async function — caller cannot await completion
    - startCronJobs() calls a CronJob instance as a function — TypeError at runtime
    - CronJob.start() is never called — scheduled jobs won't fire
    - logError is undefined in createDatabaseDumpJob.js — ReferenceError in catch block
    - startCronJobs() is commented out in index.mjs — scheduler is disabled
    - No health check endpoint exists
    - No routes defined on Express server
