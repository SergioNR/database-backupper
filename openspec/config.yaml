schema: spec-driven

context: |
  Tech stack: Node.js (ESM via "type": "module"), Express 5, Prisma ORM, @aws-sdk/client-s3, pg_dump (PostgreSQL client)
  Runtime: Docker (Node 26 Alpine-based), multi-platform (AMD64/ARM64)
  Entry point: src/index.js
  Package manager: npm
  Container port: 12500
  Backup output: /tmp inside container, mounted via Docker volumes
  CI: GitHub Actions — builds on push to "latest" or "next" branches, pushes to sergion14/database-backup on Docker Hub
  File extensions: .js for all modules (ESM via "type": "module")
  Metadata database: PostgreSQL via Prisma (DATABASE_URL)
  API endpoints:
    - POST /backups — create backup request
    - GET /backups — list all requests
    - GET /backups/:id — get specific request
    - GET /health — health check
    - GET /api-docs — Swagger UI
  Processors:
    - Both processors poll every 15 min (configurable via PROCESSOR_INTERVAL)
  Status lifecycle: pending → dumping → dumped → uploading → uploaded (or failed at any stage)
